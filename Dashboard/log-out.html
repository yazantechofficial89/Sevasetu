<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logout | SevaSetu</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

/* GLOBAL */
body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(120deg,#011232,#0c1c2e);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* BOX */
.box{
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.14);
padding:40px;
border-radius:20px;
backdrop-filter:blur(10px);
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.box h2{
color:#ff7b00;
margin-bottom:10px;
}

/* LOADER */
.loader{
border:4px solid rgba(255,255,255,0.2);
border-top:4px solid #ff7b00;
border-radius:50%;
width:50px;
height:50px;
margin:20px auto;
animation:spin 1s linear infinite;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

</style>
</head>

<body>

<div class="box">
<h2>🔓 Logging Out...</h2>
<div class="loader"></div>
<p>Redirecting to Login Page</p>
</div>

<script>

// Logout logic (sirf login session remove hoga, database safe rahega)
localStorage.removeItem("sevasetu_currentUser");
localStorage.removeItem("name");
localStorage.removeItem("email");
localStorage.removeItem("user");

// 1.5 second baad login page pe redirect
setTimeout(()=>{
window.location.href = "../Signin-Page/Donor-signin.html";
}, 1500);

</script>

</body>
</html>
