<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Donate & Urgent Needs | SevaSetu</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<!-- Real-Time WebSockets & API -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="../realtime.js"></script>
<!-- Real-Time Live Chat Widget -->
<script src="../chat-widget.js"></script>

<style>

/* GLOBAL */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(120deg,#011232,#0c1c2e);
background-attachment:fixed;
color:white;
overflow-x:hidden;
min-height:100vh;
display:flex;
flex-direction:column;
}

/* PARTICLES */
#particles-js{
position:fixed;
width:100%;
height:100%;
z-index:-1;
}

/* HEADER */
.header-bar{
width:100%;
padding:15px 30px;
background:rgba(255,255,255,0.06);
border-bottom:1px solid rgba(255,255,255,0.12);
backdrop-filter:blur(10px);
display:flex;
justify-content:space-between;
align-items:center;
position:fixed;
top:0;
left:0;
z-index:1000;
}

.logo{
font-size:22px;
font-weight:bold;
color:#ff7b00;
text-decoration:none;
}

.nav-links{
display:flex;
gap:20px;
}

.nav-links a{
text-decoration:none;
color:white;
transition:0.3s;
font-size:14px;
}

.nav-links a:hover{
color:#ff7b00;
}

/* MAIN */
.container{
margin-top:100px;
padding:20px 25px 60px;
max-width:1200px;
width:100%;
margin-left:auto;
margin-right:auto;
flex:1;
}

/* SECTION TITLE */
.section-title{
margin:30px 0 15px;
color:#ff7b00;
font-size:22px;
display:flex;
align-items:center;
gap:10px;
}

/* FILTER BAR */
.filter-bar{
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.12);
border-radius:20px;
padding:18px 22px;
backdrop-filter:blur(15px);
margin-bottom:30px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
display:flex;
flex-direction:column;
gap:15px;
}

.filter-row-top{
display:flex;
flex-wrap:wrap;
gap:12px;
align-items:center;
justify-content:space-between;
}

.search-box{
position:relative;
flex:1;
min-width:240px;
}

.search-box input{
width:100%;
padding:10px 16px 10px 40px;
border-radius:25px;
border:1px solid rgba(255,255,255,0.15);
background:rgba(255,255,255,0.08);
color:white;
outline:none;
font-size:14px;
transition:0.3s;
}

.search-box input:focus{
border-color:#ff7b00;
box-shadow:0 0 12px rgba(255,123,0,0.35);
}

.search-box i{
position:absolute;
left:14px;
top:50%;
transform:translateY(-50%);
color:#aaa;
}

.city-select{
background:rgba(1,18,50,0.85);
border:1px solid rgba(255,255,255,0.15);
color:white;
padding:9px 16px;
border-radius:20px;
outline:none;
font-size:13px;
cursor:pointer;
transition:0.3s;
}

.city-select:focus{
border-color:#ff7b00;
}

.filter-row-pills{
display:flex;
flex-wrap:wrap;
gap:8px;
align-items:center;
}

.filter-pill{
padding:6px 14px;
border-radius:20px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.14);
color:#cbd5e1;
cursor:pointer;
font-size:12px;
transition:0.2s;
user-select:none;
display:inline-flex;
align-items:center;
gap:6px;
}

.filter-pill:hover{
background:rgba(255,123,0,0.15);
border-color:#ff7b00;
color:#fff;
}

.filter-pill.active{
background:linear-gradient(135deg,#ff7b00,#ff5500);
border-color:#ff7b00;
color:#fff;
font-weight:600;
box-shadow:0 4px 12px rgba(255,123,0,0.35);
}

/* URGENT NEEDS CAROUSEL / GRID */
.urgent-grid{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
gap:20px;
margin-bottom:35px;
}

.urgent-card{
background:linear-gradient(135deg, rgba(255,123,0,0.1), rgba(255,255,255,0.05));
border:1px solid rgba(255,123,0,0.35);
border-radius:18px;
padding:22px;
backdrop-filter:blur(15px);
box-shadow:0 10px 25px rgba(0,0,0,0.35);
transition:all 0.3s ease;
position:relative;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.urgent-card:hover{
transform:translateY(-5px);
border-color:#ff7b00;
box-shadow:0 15px 35px rgba(255,123,0,0.3);
}

.urgent-header{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:10px;
margin-bottom:10px;
}

.urgent-badge{
background:rgba(239, 68, 68, 0.2);
color:#f87171;
border:1px solid rgba(239, 68, 68, 0.4);
padding:3px 9px;
border-radius:12px;
font-size:11px;
font-weight:700;
display:inline-flex;
align-items:center;
gap:5px;
}

.progress-bar-container{
width:100%;
height:8px;
background:rgba(255, 255, 255, 0.12);
border-radius:10px;
overflow:hidden;
margin:12px 0 6px;
position:relative;
}

.progress-fill{
height:100%;
background:linear-gradient(90deg, #ff7b00, #ff5500);
border-radius:10px;
transition:width 0.6s ease;
}

.progress-stats{
display:flex;
justify-content:space-between;
font-size:12px;
color:#cbd5e1;
margin-bottom:14px;
}

/* GENERAL GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
gap:20px;
margin-bottom:30px;
}

/* CARD */
.card{
padding:22px;
border-radius:18px;
background:rgba(255,255,255,0.07);
border:1px solid rgba(255,255,255,0.12);
backdrop-filter:blur(10px);
box-shadow:0 8px 20px rgba(0,0,0,0.3);
transition:0.3s;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.card:hover{
transform:translateY(-4px);
border-color:rgba(255,123,0,0.5);
box-shadow:0 12px 30px rgba(255,123,0,0.25);
}

.card-top{
margin-bottom:12px;
}

.card h3{
color:#ff7b00;
margin-bottom:4px;
font-size:17px;
}

.card-location{
font-size:12px;
color:#94a3b8;
margin-bottom:10px;
display:flex;
align-items:center;
gap:5px;
}

/* LIST */
ul{
list-style:none;
margin:10px 0;
font-size:13px;
}

ul li{
margin:6px 0;
color:#dfe5ee;
display:flex;
align-items:center;
gap:8px;
}

/* BUTTON */
button.btn-donate{
margin-top:12px;
padding:9px 20px;
border:none;
background:linear-gradient(135deg,#ff7b00,#ff5500);
color:white;
font-weight:600;
border-radius:25px;
cursor:pointer;
transition:0.3s;
font-size:13px;
width:100%;
display:flex;
align-items:center;
justify-content:center;
gap:6px;
box-shadow:0 4px 14px rgba(255,123,0,0.3);
}

button.btn-donate:hover{
background:linear-gradient(135deg,#ff5500,#d9480f);
box-shadow:0 6px 20px rgba(255,123,0,0.5);
transform:translateY(-2px);
}

.no-results{
text-align:center;
padding:40px;
color:#94a3b8;
grid-column: 1 / -1;
font-size:15px;
}

/* FOOTER */
.footer{
margin-top:auto;
padding:20px;
text-align:center;
background:rgba(1,18,50,0.9);
border-top:1px solid rgba(255,255,255,0.1);
font-size:14px;
color:#aaa;
}

</style>
</head>

<body>

<div id="particles-js"></div>

<!-- HEADER -->
<div class="header-bar">
<a href="Donor-dashboard.html" class="logo">SevaSetu</a>

<div class="nav-links">
<a href="Donor-dashboard.html">Home</a>
<a href="donate.html" style="color:#ff7b00;font-weight:600;">Donate</a>
<a href="Payment.html">Payment</a>
<a href="history.html">History</a>
<a href="profile.html">Profile</a>
</div>
</div>

<!-- MAIN -->
<div class="container">

<!-- SMART SEARCH & MULTI-FILTER BAR -->
<div class="filter-bar">
    <div class="filter-row-top">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search by home, cause, or item (e.g. Books, Delhi)...">
        </div>

        <select id="cityFilter" class="city-select">
            <option value="">📍 All Cities (India)</option>
            <option value="Delhi">Delhi / NCR</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Pune">Pune</option>
            <option value="Bengaluru">Bengaluru</option>
            <option value="Kolkata">Kolkata</option>
            <option value="Hyderabad">Hyderabad</option>
        </select>
    </div>

    <div class="filter-row-pills">
        <span style="font-size:12px;color:#94a3b8;margin-right:6px;">Type:</span>
        <div class="filter-pill active" data-type="all"><i class="fa-solid fa-border-all"></i> All Homes</div>
        <div class="filter-pill" data-type="orphanage"><i class="fa-solid fa-hands-holding-child"></i> Orphanages</div>
        <div class="filter-pill" data-type="oldage"><i class="fa-solid fa-person-cane"></i> Old Age Homes</div>

        <span style="font-size:12px;color:#94a3b8;margin-left:14px;margin-right:6px;">Needs:</span>
        <div class="filter-pill active" data-tag="all">All Needs</div>
        <div class="filter-pill" data-tag="food">🍚 Food</div>
        <div class="filter-pill" data-tag="medical">💊 Medicines</div>
        <div class="filter-pill" data-tag="books">📚 Books & Study</div>
        <div class="filter-pill" data-tag="clothes">👕 Clothes & Blankets</div>
    </div>
</div>

<!-- 🚨 FEATURE 2: LIVE URGENT NEEDS WITH PROGRESS BARS -->
<div id="urgentSection">
    <h3 class="section-title">
        <i class="fa-solid fa-triangle-exclamation" style="color:#f87171;"></i> 🚨 Urgent Community Needs (Live Progress)
    </h3>
    <div class="urgent-grid" id="urgentGrid">
        <!-- Live Urgent Needs Loaded Dynamically -->
    </div>
</div>

<!-- ALL CARE HOMES SECTION -->
<h3 class="section-title">
    <i class="fa-solid fa-hand-holding-heart"></i> Verified Care Homes
</h3>

<div class="grid" id="homesGrid">
    <!-- Populated dynamically via API / Local Fallback -->
</div>

</div>

<!-- FOOTER -->
<div class="footer">
© 2026 SevaSetu | Every contribution saves lives ❤️
</div>

<script>

// Organization database
const masterHomes = [
    {
        name: "Sunrise Orphanage",
        type: "orphanage",
        city: "Delhi",
        tags: ["food", "books", "clothes"],
        items: ["🍚 Warm meals & Groceries", "👕 Winter jackets & Socks", "📚 CBSE Math & Science books"]
    },
    {
        name: "Happy Old Age Home",
        type: "oldage",
        city: "Delhi",
        tags: ["medical", "food"],
        items: ["💊 BP & Diabetes Medicines", "🍎 Nutritional fruits", "🦽 Wheelchair & Walkers"]
    },
    {
        name: "Bal Asha Trust",
        type: "orphanage",
        city: "Mumbai",
        tags: ["books", "food"],
        items: ["🧸 Educational toys", "📖 Study materials & Notebooks", "🥛 Fresh Milk Drive"]
    },
    {
        name: "Care & Love Old Age Home",
        type: "oldage",
        city: "Mumbai",
        tags: ["medical", "food"],
        items: ["💉 Dialysis support", "🧴 Adult hygiene kits", "🛏 Orthopedic mattresses"]
    },
    {
        name: "Snehalaya Children Home",
        type: "orphanage",
        city: "Pune",
        tags: ["books", "clothes"],
        items: ["💻 Computer lab components", "👟 School shoes & Uniforms", "🎨 Arts & Craft kits"]
    },
    {
        name: "Matoshree Vriddhashram",
        type: "oldage",
        city: "Pune",
        tags: ["medical", "clothes"],
        items: ["🛏 Warm blankets", "🩺 Monthly doctor visits", "🍚 Ration kits"]
    },
    {
        name: "Vatsalya Children Foundation",
        type: "orphanage",
        city: "Bengaluru",
        tags: ["books", "food"],
        items: ["🎒 School bags & stationery", "🥗 Protein breakfast supplies", "🥋 Karate training funds"]
    },
    {
        name: "Asha Kiran Senior Living",
        type: "oldage",
        city: "Bengaluru",
        tags: ["medical"],
        items: ["🦵 Physiotherapy machines", "💊 Cardiac medicines", "🦯 Walking canes"]
    },
    {
        name: "Shanti Nivas Old Age Home",
        type: "oldage",
        city: "Kolkata",
        tags: ["medical", "clothes"],
        items: ["👁 Eye Cataract surgeries", "🪭 Room fans for summers", "👕 Cotton sarees & kurtas"]
    },
    {
        name: "Hope Children Orphanage",
        type: "orphanage",
        city: "Hyderabad",
        tags: ["food", "clothes"],
        items: ["☀️ Solar water heater fund", "🌧 Raincoats & Umbrellas", "🍚 Daily grains & lentils"]
    }
];

let defaultUrgentNeeds = [
    {
        id: 1,
        org_name: "Sunrise Orphanage",
        title: "Winter Clothes & Blankets Drive",
        target_amount: 25000,
        raised_amount: 17500,
        urgency: "Critical",
        category: "clothes"
    },
    {
        id: 2,
        org_name: "Happy Old Age Home",
        title: "Senior Medical Checkups & Medicines",
        target_amount: 40000,
        raised_amount: 28000,
        urgency: "High",
        category: "medical"
    },
    {
        id: 3,
        org_name: "Bal Asha Trust",
        title: "Annual School Fees & Science Books",
        target_amount: 50000,
        raised_amount: 15000,
        urgency: "High",
        category: "books"
    }
];

// Active Filters State
let currentType = "all";
let currentTag = "all";
let currentCity = "";
let currentSearch = "";

// Load Live Urgent Needs
async function loadUrgentNeeds(){
    let needs = defaultUrgentNeeds;
    if(window.SevaSetuAPI){
        let res = await window.SevaSetuAPI.getUrgentNeeds();
        if(res && res.success && res.needs && res.needs.length > 0){
            needs = res.needs;
        }
    }

    const container = document.getElementById("urgentGrid");
    container.innerHTML = "";

    needs.forEach(need => {
        let pct = Math.min(100, Math.round((Number(need.raised_amount) / Number(need.target_amount)) * 100));
        let card = document.createElement("div");
        card.className = "urgent-card";
        card.innerHTML = `
            <div>
                <div class="urgent-header">
                    <div>
                        <span class="urgent-badge"><i class="fa-solid fa-fire"></i> ${need.urgency || 'Urgent'}</span>
                        <h4 style="margin-top:8px;font-size:16px;color:#fff;font-weight:600;">${need.title}</h4>
                        <p style="font-size:12px;color:#ff9900;margin-top:2px;"><i class="fa-solid fa-house-chimney"></i> ${need.org_name}</p>
                    </div>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-fill" style="width: ${pct}%;"></div>
                </div>
                <div class="progress-stats">
                    <span>Raised: <strong>₹${Number(need.raised_amount).toLocaleString('en-IN')}</strong></span>
                    <span>Target: <strong>₹${Number(need.target_amount).toLocaleString('en-IN')}</strong> (${pct}%)</span>
                </div>
            </div>
            <button class="btn-donate" onclick="donate('${need.org_name}', '${need.title}')">
                <i class="fa-solid fa-hand-holding-heart"></i> Fulfill This Need
            </button>
        `;
        container.appendChild(card);
    });
}

// Render Care Homes based on active filters
function renderHomes(){
    const container = document.getElementById("homesGrid");
    container.innerHTML = "";

    let filtered = masterHomes.filter(home => {
        // Type filter
        if(currentType !== "all" && home.type !== currentType) return false;
        // City filter
        if(currentCity && home.city.toLowerCase() !== currentCity.toLowerCase()) return false;
        // Tag filter
        if(currentTag !== "all" && !home.tags.includes(currentTag)) return false;
        // Search filter
        if(currentSearch){
            let hay = (home.name + " " + home.city + " " + home.items.join(" ")).toLowerCase();
            if(!hay.includes(currentSearch)) return false;
        }
        return true;
    });

    if(filtered.length === 0){
        container.innerHTML = `<div class="no-results"><i class="fa-solid fa-magnifying-glass" style="font-size:30px;margin-bottom:10px;display:block;"></i>No care homes match your current filters. Try resetting the search or category filters.</div>`;
        return;
    }

    filtered.forEach(home => {
        let card = document.createElement("div");
        card.className = "card";
        let isOrphanage = home.type === "orphanage";
        let itemsList = home.items.map(it => `<li>${it}</li>`).join("");

        card.innerHTML = `
            <div class="card-top">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                    <span style="font-size:11px;padding:3px 8px;border-radius:10px;background:${isOrphanage ? 'rgba(255,123,0,0.2)' : 'rgba(14,165,233,0.2)'};color:${isOrphanage ? '#ff9900' : '#38bdf8'};font-weight:600;">
                        ${isOrphanage ? 'Orphanage' : 'Old Age Home'}
                    </span>
                    <span style="font-size:11px;color:#34d399;"><i class="fa-solid fa-circle-check"></i> Verified</span>
                </div>
                <h3>${home.name}</h3>
                <div class="card-location"><i class="fa-solid fa-location-dot" style="color:#ff7b00;"></i> ${home.city}, India</div>
                <ul>${itemsList}</ul>
            </div>
            <button class="btn-donate" onclick="donate('${home.name}', '${home.items[0].replace(/[^a-zA-Z &]/g, '').trim()}')">
                <i class="fa-solid fa-heart"></i> Donate Now
            </button>
        `;
        container.appendChild(card);
    });
}

function donate(name, type){
    sessionStorage.setItem("sevasetu_selectedOrg", name);
    sessionStorage.setItem("sevasetu_selectedType", type || "General Support");
    window.location.href = `Payment.html?org=${encodeURIComponent(name)}&type=${encodeURIComponent(type || 'General Support')}`;
}

// Event Listeners for Filters
document.querySelectorAll('.filter-row-pills .filter-pill[data-type]').forEach(pill => {
    pill.addEventListener('click', function(){
        document.querySelectorAll('.filter-row-pills .filter-pill[data-type]').forEach(p => p.classList.remove('active'));
        this.classList.add('active');
        currentType = this.dataset.type;
        renderHomes();
    });
});

document.querySelectorAll('.filter-row-pills .filter-pill[data-tag]').forEach(pill => {
    pill.addEventListener('click', function(){
        document.querySelectorAll('.filter-row-pills .filter-pill[data-tag]').forEach(p => p.classList.remove('active'));
        this.classList.add('active');
        currentTag = this.dataset.tag;
        renderHomes();
    });
});

document.getElementById("cityFilter").addEventListener("change", function(){
    currentCity = this.value;
    renderHomes();
});

document.getElementById("searchInput").addEventListener("input", function(){
    currentSearch = this.value.trim().toLowerCase();
    renderHomes();
});

// Initialization & Real-Time updates
window.addEventListener("DOMContentLoaded", () => {
    loadUrgentNeeds();
    renderHomes();

    // Listen to real-time events
    if(window.SevaSetuSocket){
        window.SevaSetuSocket.on('new_urgent_need', () => {
            loadUrgentNeeds();
        });
        window.SevaSetuSocket.on('new_donation', () => {
            loadUrgentNeeds();
        });
    }
});

/* PARTICLES */
particlesJS("particles-js",{
    particles:{
        number:{value:60},
        color:{value:"#ff7b00"},
        size:{value:3},
        move:{speed:2},
        line_linked:{enable:true,color:"#ff7b00",opacity:0.3}
    }
});

</script>

</body>
</html>
