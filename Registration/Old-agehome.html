<!DOCTYPE html>

<style>

margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}

body{
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
background:linear-gradient(120deg,#011232,#0c1c2e);
background-size:400% 400%;
animation:gradientBG 12s ease infinite;

color:white;
}

/* HEADER */

display:flex;
justify-content:space-between;
align-items:center;

backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,0.1);
z-index:1000;
}

.logo{
font-size:22px;
font-weight:600;
}

.logo span{
color:#ff7b00;
}

nav a{
margin-left:20px;
text-decoration:none;
color:white;
font-size:14px;
transition:.3s;
}

nav a:hover{
color:#ff7b00;
}

/* MAIN */
.main{
margin-top:100px;
margin-bottom:40px;
display:flex;
justify-content:center;
width:100%;
}

/* FOOTER */

footer{
margin-top:auto;
width: 100%;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(10px);
padding:40px 20px;
text-align:center;
}

.footer-content{
max-width:1000px;
margin:auto;
}

.footer-content h3{
color:#ff7b00;
margin-bottom:10px;
}

.footer-content p{
color:#ccc;
font-size:14px;
margin-bottom:15px;
}

.footer-links a{
color:#aaa;
margin:0 10px;
text-decoration:none;
font-size:13px;
}

.footer-links a:hover{
color:#ff7b00;
}

.footer-bottom{
margin-top:20px;
font-size:12px;
color:#777;
}


/* BACKGROUND */
#network{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

/* BOX */
.register-box{
width:450px;
padding:40px;
border-radius:20px;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,0.15);

box-shadow:0 15px 35px rgba(0,0,0,0.4);
text-align:center;

animation:fadeIn 1.2s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(30px);}
to{opacity:1;transform:translateY(0);}
}

h1{
font-size:30px;
margin-bottom:10px;
}

span{
color:#ff7b00;
}

.subtitle{
font-size:14px;
color:#ccc;
margin-bottom:25px;
}

form{
display:flex;
flex-direction:column;
}

input,select,textarea{
padding:12px 15px;
margin-bottom:15px;
border-radius:25px;
border:none;
outline:none;

background:rgba(255,255,255,0.1);
color:white;
}

textarea{
border-radius:15px;
resize:none;
height:80px;
}

select option{
color:black;
}

button{
padding:12px;
border-radius:25px;
border:none;

font-size:13px;
margin-bottom:10px;

</style>
</head>

<body>

<header>
<a href="../Homepage.html" style="text-decoration:none;color:white;" class="logo">Seva<span>Setu</span></a>
<nav>
<a href="../Homepage.html">Home</a>
<a href="../legal-links/about.html">About</a>
<a href="../legal-links/contact.html">Contact</a>
<a href="../legal-links/help.html">Help</a>
</nav>
</header>

<canvas id="network"></canvas>

<div class="main">
<div class="register-box">

<h1>Old Age Home <span>Registration</span></h1>
<p class="subtitle">Register your old age home and receive support</p>

<form id="form">

<input id="homeName" type="text" placeholder="Old Age Home Name">
<input id="manager" type="text" placeholder="Manager Name">
<input id="email" type="email" placeholder="Email Address">
<input id="mobile" type="tel" placeholder="Mobile Number">

<select id="city">
<option value="">Select City</option>
<option>Delhi</option>
<option>Mumbai</option>
<option>Jaipur</option>
<option>Pune</option>
<option>Lucknow</option>
</select>

<textarea id="address" placeholder="Full Address"></textarea>

<input id="residents" type="number" placeholder="Number of Residents">

<select id="medical">
<option value="">Medical Facility</option>
<option>Available</option>
<option>Not Available</option>
</select>

<textarea id="needs" placeholder="Enter Needs (Food, Medicines, Clothes...)"></textarea>

<input id="regNo" type="text" placeholder="Government Registration Number">

<input id="pass1" type="password" placeholder="Create Password">
<input id="pass2" type="password" placeholder="Confirm Password">

<div class="error" id="error"></div>

<button type="submit">Register Old Age Home</button>
<p style="margin-top:15px;font-size:14px;">Already registered? <a href="../Signin-Page/Old-age.html" style="color:#ff7b00;text-decoration:underline;">Sign in here</a></p>

</form>

<div class="success" id="success"></div>

</div>
</div>

<footer>
<div class="footer-content">
<h3>SevaSetu</h3>
<p>Connecting donors with those in need ❤️</p>

<div class="footer-links">
<a href="../Homepage.html">Home</a>
<a href="../legal-links/about.html">About</a>
<a href="../legal-links/contact.html">Contact</a>
<a href="../legal-links/Privacy-Policy.html">Privacy Policy</a>
</div>

<div class="footer-bottom">
© 2026 SevaSetu | All Rights Reserved
</div>
</div>
</footer>

<script>

const form=document.getElementById("form")
const error=document.getElementById("error")
const success=document.getElementById("success")

form.addEventListener("submit",function(e){

e.preventDefault()

let name=document.getElementById("homeName").value
let manager=document.getElementById("manager").value
let email=document.getElementById("email").value
let mobile=document.getElementById("mobile").value
let city=document.getElementById("city").value
let address=document.getElementById("address").value
let residents=document.getElementById("residents").value
let medical=document.getElementById("medical").value
let needs=document.getElementById("needs").value
let regNo=document.getElementById("regNo").value
let pass1=document.getElementById("pass1").value
let pass2=document.getElementById("pass2").value

error.innerHTML=""

if(name.length<3){error.innerHTML="Enter home name";return}
if(manager.length<3){error.innerHTML="Enter manager name";return}
if(!email.includes("@")){error.innerHTML="Invalid email";return}
if(mobile.length!==10){error.innerHTML="Invalid mobile";return}
if(city===""){error.innerHTML="Select city";return}
if(address.length<5){error.innerHTML="Enter address";return}
if(residents<=0){error.innerHTML="Enter valid residents count";return}
if(medical===""){error.innerHTML="Select medical facility";return}
if(needs.length<5){error.innerHTML="Enter needs";return}
if(regNo.length<3){error.innerHTML="Enter registration number";return}
if(pass1.length<6){error.innerHTML="Password too short (min 6 characters)";return}
if(pass1!==pass2){error.innerHTML="Passwords mismatch";return}

/* LOCALSTORAGE */
let homes = JSON.parse(localStorage.getItem("sevasetu_oldage_users") || "[]");
if(homes.some(h => h.email.toLowerCase() === email.trim().toLowerCase())){
    error.innerHTML = "This email is already registered! Please sign in.";
    return;
}

homes.push({ id: Date.now(), name, homeName: name, manager, email: email.trim(), mobile, city, address, residents, medical, needs, regNo, password: pass1, status: 'pending', joinedDate: new Date().toLocaleDateString() });
localStorage.setItem("sevasetu_oldage_users", JSON.stringify(homes));
localStorage.setItem("sevasetu_lastRegisteredOldAgeEmail", email.trim());

// Register on Real SQLite Backend Server
const apiBase = window.API_BASE || (window.location.origin.startsWith('http') ? window.location.origin : 'http://localhost:5000');
fetch(`${apiBase}/api/auth/register`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
        role: "oldage",
        name,
        manager,
        email: email.trim(),
        mobile,
        city,
        address,
        password: pass1,
        extra_info: { residents, medical, needs, regNo }
    })
}).catch(err => console.log('Offline fallback used'));

success.innerHTML = `
    <div style="background:rgba(245,158,11,0.15);border:1px solid #f59e0b;padding:15px;border-radius:12px;margin-top:15px;">
        <h4 style="color:#fbbf24;margin-bottom:6px;"><i class="fa-solid fa-clock"></i> Registration Submitted!</h4>
        <p style="font-size:13px;color:#cbd5e1;line-height:1.5;">Your old age home registration is pending <strong>Admin Approval</strong>. Once verified, you will be able to log in to your dashboard.</p>
    </div>
`;
setTimeout(()=>{ window.location.href="../Signin-Page/Old-age.html"; }, 3500);

})

/* PARTICLES */
const canvas=document.getElementById("network")
const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let particles=[]

class Particle{
constructor(){
this.x=Math.random()*canvas.width
this.y=Math.random()*canvas.height
this.vx=Math.random()*0.6-0.3
this.vy=Math.random()*0.6-0.3
}
update(){
this.x+=this.vx
this.y+=this.vy
if(this.x<0||this.x>canvas.width) this.vx*=-1
if(this.y<0||this.y>canvas.height) this.vy*=-1
}
draw(){
ctx.fillStyle="white"
ctx.beginPath()
ctx.arc(this.x,this.y,2,0,Math.PI*2)
ctx.fill()
}
}

for(let i=0;i<90;i++) particles.push(new Particle())

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height)
particles.forEach(p=>{p.update();p.draw()})

for(let i=0;i<particles.length;i++){
for(let j=i;j<particles.length;j++){
let dx=particles[i].x-particles[j].x
let dy=particles[i].y-particles[j].y
let dist=Math.sqrt(dx*dx+dy*dy)

if(dist<120){
ctx.strokeStyle="rgba(255,255,255,0.15)"
ctx.beginPath()
ctx.moveTo(particles[i].x,particles[i].y)
ctx.lineTo(particles[j].x,particles[j].y)
ctx.stroke()
}
}
}
requestAnimationFrame(animate)
}
animate()

</script>

</body>
</html>
