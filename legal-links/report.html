<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SevaSetu | Report Issue</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* GLOBAL */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
color:white;
min-height:100vh;
display:flex;
flex-direction:column;
background:linear-gradient(120deg,#011232,#0c1c2e);
background-attachment:fixed;
}

/* HEADER */

.header{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,0.1);
z-index:10;
}

.logo-header{
font-size:22px;
font-weight:bold;
color:#ff7b00;
}

.nav a{
transition:0.3s;
}

.nav a:hover{
color:#ff7b00 !important;
}

/* PARTICLES */

#particles-js{
position:fixed;
width:100%;
height:100%;
z-index:-1;
}

/* CONTAINER */

.container{
max-width:600px;
width:90%;
margin:120px auto 40px;
background:rgba(255,255,255,0.06);
padding:40px;
border-radius:20px;
border:1px solid rgba(255,255,255,0.12);
backdrop-filter:blur(15px);
box-shadow:0 15px 40px rgba(0,0,0,0.4);
flex:1;
}

/* TITLE */

h1{
text-align:center;
margin-bottom:25px;
}

h1 span{
color:#ff7b00;
}

/* FORM */

.form-group{
margin-bottom:18px;
}

input, select, textarea{
width:100%;
padding:12px 15px;
border:1px solid rgba(255,255,255,0.15);
border-radius:10px;
outline:none;
background:rgba(255,255,255,0.08);
color:white;
font-size:14px;
transition:0.3s;
}

input:focus, select:focus, textarea:focus{
border-color:#ff7b00;
box-shadow:0 0 10px rgba(255,123,0,0.4);
}

select option{
background:#0c1c2e;
color:white;
}

textarea{
resize:none;
height:120px;
}

/* BUTTON */

button{
width:100%;
padding:13px;
border:none;
border-radius:25px;
background:linear-gradient(to right,#ff7b00,#ff5500);
color:white;
font-weight:600;
font-size:15px;
cursor:pointer;
box-shadow:0 0 15px rgba(255,123,0,0.4);
transition:0.3s;
margin-top:10px;
}

button:hover{
transform:scale(1.03);
box-shadow:0 0 25px rgba(255,123,0,0.7);
}

/* FOOTER */

.footer{
margin-top:auto;
background:rgba(1,18,50,0.9);
border-top:1px solid rgba(255,255,255,0.1);
padding:20px;
text-align:center;
}

.footer p{
color:#aaa;
font-size:14px;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<a href="../Homepage.html" style="text-decoration:none;color:#ff7b00;" class="logo-header">
<i class="fa-solid fa-house-user"></i> SevaSetu
</a>

<div class="nav" style="display:flex;gap:20px;">
<a href="../Homepage.html" style="color:white;text-decoration:none;">Home</a>
<a href="help.html" style="color:white;text-decoration:none;">Help</a>
<a href="contact.html" style="color:white;text-decoration:none;">Contact</a>
</div>
</div>

<!-- PARTICLES -->
<div id="particles-js"></div>

<!-- CONTENT -->
<div class="container">

<h1>Report an <span>Issue</span></h1>

<form onsubmit="submitIssue(event)">

<div class="form-group">
<input type="text" id="name" placeholder="Your Name" required>
</div>

<div class="form-group">
<input type="email" id="email" placeholder="Your Email" required>
</div>

<div class="form-group">
<select id="type">
<option>Payment Issue</option>
<option>Login Problem</option>
<option>Donation Issue</option>
<option>Other</option>
</select>
</div>

<div class="form-group">
<textarea id="message" placeholder="Describe your issue..." required></textarea>
</div>

<button type="submit">Submit Issue</button>

</form>

</div>

<!-- FOOTER -->
<div class="footer">
<p>© 2026 SevaSetu | All Rights Reserved</p>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<script>

/* SUBMIT FUNCTION */

function submitIssue(e){
e.preventDefault();

let name = document.getElementById("name").value;
let email = document.getElementById("email").value;
let type = document.getElementById("type").value;
let message = document.getElementById("message").value;

/* WHATSAPP */
let phone = "917011906923";
let text = `Issue Report%0AName: ${name}%0AEmail: ${email}%0AType: ${type}%0AMessage: ${message}`;
let url = "https://wa.me/" + phone + "?text=" + text;

window.open(url, "_blank");

/* EMAIL */
window.location.href = `mailto:support@sevasetu.com?subject=Issue Report&body=Name:${name}%0AEmail:${email}%0AType:${type}%0AMessage:${message}`;

alert("Issue Submitted Successfully ✅");
}

/* PARTICLES */

particlesJS("particles-js",{
particles:{
number:{value:70},
color:{value:"#ff7b00"},
size:{value:3},
move:{speed:2},
line_linked:{enable:true,color:"#ff7b00",opacity:0.3}
}
});

</script>

</body>
</html>
