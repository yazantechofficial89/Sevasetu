<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SevaSetu | Contact Us</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* GLOBAL */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
color:white;
min-height:100vh;
display:flex;
flex-direction:column;
background:linear-gradient(120deg,#011232,#0c1c2e);
background-attachment:fixed;
}

/* HEADER */

.header{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:rgba(255,255,255,0.06);
border-bottom:1px solid rgba(255,255,255,0.12);
backdrop-filter:blur(10px);
z-index:10;
}

.logo-header{
font-size:22px;
font-weight:bold;
color:#ff7b00;
}

.nav a{
margin-left:25px;
text-decoration:none;
color:white;
transition:0.3s;
}

.nav a:hover{
color:#ff7b00;
}

/* PARTICLES */

#particles-js{
position:fixed;
width:100%;
height:100%;
z-index:-1;
}

/* CONTAINER */

.container{
max-width:1000px;
margin:120px auto 40px;
display:flex;
gap:30px;
flex-wrap:wrap;
}

/* LEFT INFO */

.contact-info{
flex:1;
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.12);
padding:30px;
border-radius:20px;
backdrop-filter:blur(15px);
}

.contact-info h2{
margin-bottom:20px;
color:#ff7b00;
}

.info-box{
margin-bottom:15px;
}

.info-box i{
margin-right:10px;
color:#ff7b00;
}

/* FORM */

.contact-form{
flex:1;
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.12);
padding:30px;
border-radius:20px;
backdrop-filter:blur(15px);
}

.contact-form h2{
margin-bottom:20px;
color:#ff7b00;
}

input, textarea{
width:100%;
padding:12px 15px;
margin-bottom:15px;
border:1px solid rgba(255,255,255,0.15);
border-radius:12px;
outline:none;
background:rgba(255,255,255,0.1);
color:white;
transition:0.3s;
}

input:focus, textarea:focus{
border-color:#ff7b00;
}

textarea{
height:120px;
resize:none;
}

/* BUTTON */

button{
width:100%;
padding:12px;
border:none;
border-radius:25px;
background:linear-gradient(to right,#ff7b00,#ff5500);
color:white;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
box-shadow:0 0 20px rgba(255,123,0,0.6);
}

/* FOOTER */

.footer{
margin-top:auto;
background:rgba(1,18,50,0.9);
border-top:1px solid rgba(255,255,255,0.1);
padding:20px;
text-align:center;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<a href="../Homepage.html" style="text-decoration:none;color:#ff7b00;" class="logo-header">
<i class="fa-solid fa-hand-holding-heart"></i> SevaSetu
</a>

<div class="nav">
<a href="../Homepage.html">Home</a>
<a href="about.html">About</a>
<a href="help.html">Help</a>
</div>
</div>

<!-- PARTICLES -->
<div id="particles-js"></div>

<!-- CONTENT -->
<div class="container">

<!-- LEFT -->
<div class="contact-info">
<h2>Get in Touch</h2>

<div class="info-box">
<i class="fa-solid fa-envelope"></i> support@sevasetu.com
</div>

<div class="info-box">
<i class="fa-solid fa-phone"></i> +91 7011906923
</div>

<div class="info-box">
<i class="fa-solid fa-location-dot"></i> India
</div>

<p>We are here to help you 24/7. Feel free to contact us.</p>

</div>

<!-- FORM -->
<div class="contact-form">

<h2>Send Message</h2>

<form onsubmit="sendMessage(event)">

<input type="text" id="name" placeholder="Your Name" required>
<input type="email" id="email" placeholder="Your Email" required>
<textarea id="message" placeholder="Your Message..." required></textarea>

<button type="submit">Send Message</button>

</form>

</div>

</div>

<!-- FOOTER -->
<div class="footer">
<p>© 2026 SevaSetu | Contact Page</p>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<script>

function sendMessage(e){
e.preventDefault();

let name = document.getElementById("name").value;
let email = document.getElementById("email").value;
let message = document.getElementById("message").value;

/* WhatsApp */
let text = `Contact Message%0AName:${name}%0AEmail:${email}%0AMessage:${message}`;
window.open("https://wa.me/917011906923?text="+text,"_blank");

/* Email */
window.location.href = `mailto:support@sevasetu.com?subject=Contact Message&body=Name:${name}%0AEmail:${email}%0AMessage:${message}`;

alert("Message Sent Successfully ✅");
}

/* PARTICLES */
particlesJS("particles-js",{
particles:{
number:{value:70},
size:{value:3},
color:{value:"#ff7b00"},
move:{speed:2},
line_linked:{enable:true,color:"#ff7b00",opacity:0.3}
}
});

</script>

</body>
</html>
